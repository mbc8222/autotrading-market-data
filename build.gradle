plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.AutoTrading'
version = '0.0.1-SNAPSHOT'
description = 'autotrading-market-data'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    // Spring Boot 기본 로깅(Logback)을 제외하고 Log4j2로 로깅 구현체를 통일한다.
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencyManagement {
    imports {
        // Boot 4.x는 testcontainers 버전을 관리하지 않으므로 BOM을 직접 import 해
        // 버전 없는 testcontainers 의존성들에 버전을 공급한다.
        mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
    }
}

dependencies {
    // Spring Web(MVC): 명령형 스택 + Java 21 가상 스레드 조합. actuator 노출과 RestClient 기반 외부 API 호출에 사용한다.
    // (WebFlux 대신 명령형 채택 — 이 서비스의 실동시성은 WS 몇 개 + 폴링 수준이라 reactive 이득이 없음. docs/adr/001 참고)
    // Boot 4.0에서 spring-boot-starter-web → spring-boot-starter-webmvc 로 개명됨.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // RestClient: Boot 4.0 모듈화로 http client 설정(ClientHttpRequestFactorySettings 등)이 분리됨.
    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // WebSocket: jakarta.websocket 클라이언트(Tomcat 구현)로 바이낸스 fstream 실시간 수신.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Spring JDBC: DataSource(HikariCP) 자동설정 + JdbcClient/JdbcTemplate. Flyway도 이 DataSource를 공유한다.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Log4j2: Spring Boot 기본 Logback 대신 사용할 로깅 구현체다.
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // Validation: request parameter, DTO, configuration properties 검증에 사용한다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Actuator: health check, metrics, Prometheus endpoint 등 운영 관측 기능을 제공한다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Cache abstraction: exchange info, symbol metadata 같은 반복 조회 데이터 캐싱에 사용한다.
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Redis(Lettuce, 명령형): 최신가 key-value 저장과 시장이벤트 Redis Streams 발행에 사용한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Flyway: DB schema migration을 코드와 함께 버전 관리한다. (Boot 4.0부터 전용 starter 사용)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // Caffeine: 고성능 in-memory cache 구현체로 Spring Cache와 함께 사용한다.
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Apache Commons Lang: StringUtils, ObjectUtils 등 일반 유틸리티를 제공한다.
    implementation 'org.apache.commons:commons-lang3'

    // Apache Commons Codec: Binance signed API 구현 시 HMAC, hex, base64 처리에 사용한다.
    implementation 'commons-codec:commons-codec'

    // Lombok: getter, builder, constructor 등 반복 코드를 컴파일 시점에 생성한다.
    compileOnly 'org.projectlombok:lombok'

    // DevTools: 로컬 개발 중 자동 재시작과 개발 편의 기능을 제공한다.
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Log4j2 JSON layout: 운영 환경에서 structured logging(JSON 로그)을 구성할 때 사용한다.
    runtimeOnly 'org.apache.logging.log4j:log4j-layout-template-json'

    // Prometheus registry: Actuator metrics를 Prometheus 형식으로 노출한다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // PostgreSQL JDBC driver: DataSource 연결과 Flyway migration에 사용한다.
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway PostgreSQL support: Flyway 10+에서 PostgreSQL database support를 제공한다.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Configuration processor: application.properties/yml의 custom properties 자동완성과 metadata를 생성한다.
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Lombok annotation processor: Lombok annotation을 컴파일 시점에 처리한다.
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot test: JUnit, AssertJ, Mockito, Spring test utilities를 포함한다.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Testcontainers PostgreSQL: 실제 PostgreSQL 컨테이너로 repository/integration test를 검증한다.
    // (testcontainers 2.0부터 아티팩트명에 testcontainers- 접두사가 붙음. 버전은 BOM이 공급)
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    // Testcontainers JUnit: JUnit 5 테스트에서 Testcontainers lifecycle을 관리한다.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

    // Test Lombok: 테스트 코드에서 Lombok annotation을 사용할 수 있게 한다.
    testCompileOnly 'org.projectlombok:lombok'

    // JUnit Platform launcher: Gradle에서 JUnit Platform 기반 테스트를 실행한다.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Test Lombok annotation processor: 테스트 컴파일 시 Lombok annotation을 처리한다.
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
