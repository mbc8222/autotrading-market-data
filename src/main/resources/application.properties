server.port=8080
spring.application.name=autotrading-market-data

# 기본 프로파일 = 개발(local). 운영(Docker)은 compose 가 SPRING_PROFILES_ACTIVE=prod 로 override 한다.
# - local: 프로젝트 루트의 application-local.properties(gitignored) 자동 로드
# - prod : 접속정보를 환경변수(compose env_file: deploy/market-data.env)로 주입, 별도 properties 파일 없음
spring.profiles.active=local

# Java 21 가상 스레드 — Tomcat 요청 처리 / @Scheduled / @Async 전부 가상 스레드로 실행
spring.threads.virtual.enabled=true

# DataSource(HikariCP) 공통값. 접속정보(url/username/password)와 flyway 스키마는
# 환경별로 주입한다: 개발=application-local.properties / 운영=환경변수(SPRING_DATASOURCE_* 등).
spring.datasource.hikari.maximum-pool-size=10

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=prometheus,health,info,metrics

# Binance 선물(fapi) REST — 공개 엔드포인트(인증 불필요). 타임아웃은 폴링 주기(30s)보다 짧게.
binance.rest-base-url=https://fapi.binance.com
binance.connect-timeout=5s
binance.read-timeout=15s

# 수집 대상 — 심볼은 소문자 페어 표준, 전 수집기(kline/파생/WS/raw) 공유
collect.symbols=btcusdt,ethusdt,solusdt,xrpusdt

# 캔들 (REST 폴링)
collect.kline.enabled=true
collect.kline.intervals=1m,5m,15m,1h
collect.kline.backfill-days=7
# 1500 -> 1000: 바이낸스 klines 요청 가중치가 limit>1000 에서 10, 501~1000 에서 5 로
# 절반이 된다. 정상 상태에서는 매 요청이 1~2봉만 가져오므로 1500 은 백필에만 의미가 있고
# 상시 가중치만 두 배로 쓰고 있었다. 백필 속도는 느려지지만 상시 부담이 절반이 된다(2026-08-20).
collect.kline.page-limit=1000
collect.kline.fixed-delay=30s

# 파생 7종 (/futures/data 6종 + funding, REST 폴링)
collect.futures.enabled=true
collect.futures.fixed-delay=5m

# WebSocket 실시간 (markPrice/depth/forceOrder/aggTrade)
collect.ws.enabled=true

# 원시 집계체결(agg_trade) 적재 + 갭 보정 — 일별 파티션·90일 보존. 디스크 부담 시 off.
collect.raw.enabled=true
