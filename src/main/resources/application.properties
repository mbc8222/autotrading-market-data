spring.application.name=autotrading-market-data

spring.r2dbc.url=r2dbc:postgresql://yourIp:yourPort/yourDatabase
spring.r2dbc.username=your_username
spring.r2dbc.password=your_pwd
spring.r2dbc.pool.max-size=10
management.health.r2dbc.enabled=true
management.endpoint.health.show-details=always

spring.flyway.default-schema=yourSchema
spring.flyway.schemas=yourSchema
spring.flyway.url=jdbc:postgresql://yourIp:yourPort/yourDatabase
spring.flyway.user=your_username
spring.flyway.password=your_pwd

spring.data.redis.host=yourIp
spring.data.redis.port=0


# 로컬 시크릿 오버라이드 — application-local.properties 자동 로드
spring.profiles.include=local