server.port=8080
spring.application.name=autotrading-market-data

# Java 21 가상 스레드 — Tomcat 요청 처리 / @Scheduled / @Async 전부 가상 스레드로 실행
spring.threads.virtual.enabled=true

# DataSource (HikariCP) — 실제 값은 application-local.properties
spring.datasource.url=jdbc:postgresql://yourIp:yourPort/yourDatabase?currentSchema=yourSchema
spring.datasource.username=your_username
spring.datasource.password=your_pwd
spring.datasource.hikari.maximum-pool-size=10

# Flyway — 별도 url/계정 없이 위 DataSource를 공유한다. 스키마만 지정.
spring.flyway.default-schema=yourSchema
spring.flyway.schemas=yourSchema

# Redis — 실제 값은 application-local.properties
spring.data.redis.host=yourIp
spring.data.redis.port=0

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=prometheus,health,info,metrics

# Binance 선물(fapi) REST — 타임아웃은 폴링 주기(30s)보다 짧게
binance.rest-base-url=https://fapi.binance.com
binance.connect-timeout=5s
binance.read-timeout=15s

# 수집 대상 — 심볼은 소문자 페어 표준, 전 수집기(kline/파생/WS/raw) 공유
collect.symbols=btcusdt,ethusdt,solusdt,xrpusdt

# 캔들 (REST 폴링)
collect.kline.enabled=true
collect.kline.intervals=1m,5m,15m,1h
collect.kline.backfill-days=7
collect.kline.page-limit=1500
collect.kline.fixed-delay=30s

# 파생 7종 (/futures/data 6종 + funding, REST 폴링)
collect.futures.enabled=true
collect.futures.fixed-delay=5m

# WebSocket 실시간 (markPrice/depth/forceOrder/aggTrade)
collect.ws.enabled=true

# 원시 집계체결(agg_trade) 적재 + 갭 보정 — 일별 파티션·90일 보존. 디스크 부담 시 off.
collect.raw.enabled=true

# 로컬 시크릿 오버라이드 — application-local.properties 자동 로드
spring.profiles.include=local
